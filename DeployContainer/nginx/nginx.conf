events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Resolver de Docker para resolución dinámica de nombres de servicio
    resolver 127.0.0.11 valid=10s;

    # Nginx Proxy Manager (NPM) gestiona SSL externamente.
    # El tráfico llega aquí como HTTP desde NPM.
    # NPM se encarga de la terminación SSL y de redirigir HTTP→HTTPS.

    server {
        listen 80;
        server_name dam.yarcrasy.com;

        # Ruta para que NPM pueda resolver el challenge ACME
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Frontend (archivos estáticos)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Backend (proxy reverso con resolución dinámica)
        location /api/ {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

