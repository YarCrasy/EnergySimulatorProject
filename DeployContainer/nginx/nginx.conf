events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirigir HTTP a HTTPS (solo cuando certbot haya generado los certificados)
    # En primera ejecución, descomentar la parte de HTTP simple y luego pasar a HTTPS

    server {
        listen 80;
        server_name dam.yarcrasy.com www.dam.yarcrasy.com;

        # Para Let's Encrypt (Certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # --- Mientras no tengas SSL, sirve todo por HTTP ---
        # Frontend (archivos estáticos)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Backend (proxy reverso)
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

