services:

  # ──────────────────────────────────────────────
  #  PostgreSQL
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: energysimulator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: energysimulatordb
      POSTGRES_USER: SimulatorUser
      POSTGRES_PASSWORD: SimulatorUserPassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-data/InitBD.sql:/docker-entrypoint-initdb.d/InitBD.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U SimulatorUser -d energysimulatordb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - energysimulator-network

  # ──────────────────────────────────────────────
  #  Backend (Spring Boot)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: energysimulator-backend:latest
    container_name: energysimulator-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' 2>/dev/null && echo 'up' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/energysimulatordb
      SPRING_DATASOURCE_USERNAME: SimulatorUser
      SPRING_DATASOURCE_PASSWORD: SimulatorUserPassword123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: "change-this-secret-key-before-production"
    ports:
      - "8080:8080"
    networks:
      - energysimulator-network

  # ──────────────────────────────────────────────
  #  Frontend (Nginx)
  # ──────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: energysimulator-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./frontend-data/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - energysimulator-network
      - nginx-proxy-manager_default

  # ──────────────────────────────────────────────
  #  Demo Data Loader (se ejecuta una vez al iniciar)
  # ──────────────────────────────────────────────
  demo-data-loader:
    image: postgres:16-alpine
    container_name: energysimulator-demo-data
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend-data/InsertDemoData.sql:/InsertDemoData.sql:ro
    environment:
      PGPASSWORD: SimulatorUserPassword123
    command: >
      sh -c '
        echo "========================================"
        echo " Insertando datos de demostración..."
        echo "========================================"
        psql -h db -U SimulatorUser -d energysimulatordb -f /InsertDemoData.sql
        echo "========================================"
        echo " Datos de demostración insertados."
        echo "========================================"
      '
    networks:
      - energysimulator-network

volumes:
  postgres_data:
    name: energysimulator_postgres_data
  certbot_www:
    name: energysimulator_certbot_www

networks:
  energysimulator-network:
    name: energysimulator-network
    driver: bridge
  nginx-proxy-manager_default:
    name: nginx-proxy-manager_default
    external: true

