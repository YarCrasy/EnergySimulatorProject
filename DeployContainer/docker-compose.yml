version: '3.8'

services:

  # ──────────────────────────────────────────────
  #  PostgreSQL
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: energysimulator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: energysimulatordb
      POSTGRES_USER: SimulatorUser
      POSTGRES_PASSWORD: SimulatorUserPassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/InitBD.sql:/docker-entrypoint-initdb.d/InitBD.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U SimulatorUser -d energysimulatordb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - energysimulator-network

  # ──────────────────────────────────────────────
  #  Backend (Spring Boot)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: energysimulator-backend:latest
    container_name: energysimulator-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/energysimulatordb
      SPRING_DATASOURCE_USERNAME: SimulatorUser
      SPRING_DATASOURCE_PASSWORD: SimulatorUserPassword123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: "change-this-secret-key-before-production"
    ports:
      - "8080:8080"
    networks:
      - energysimulator-network

  # ──────────────────────────────────────────────
  #  Frontend (Nginx)
  # ──────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: energysimulator-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend-data/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - energysimulator-network

  # ──────────────────────────────────────────────
  #  Certbot (Let's Encrypt SSL)
  # ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: energysimulator-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot certonly --webroot -w /var/www/certbot
        --email contact@yarcrasy.com
        -d dam.yarcrasy.com
        -d www.dam.yarcrasy.com
        --agree-tos
        --non-interactive
        --keep-until-expiring
        || true;
        sleep 12h & wait $$!;
      done"
    networks:
      - energysimulator-network

volumes:
  postgres_data:
    name: energysimulator_postgres_data
  certbot_www:
    name: energysimulator_certbot_www
  certbot_certs:
    name: energysimulator_certbot_certs

networks:
  energysimulator-network:
    name: energysimulator-network
    driver: bridge
